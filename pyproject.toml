[project]
name = "slides-to-markdown"
version = "0.1.0"
description = "Convert lecture slide PDFs into level-adapted Markdown study docs"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10",
    "pydantic>=2.7",
    "openai>=1.40",
    "pyyaml>=6",
    "httpx>=0.27",
    "json-repair>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
s2m = "backend.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["prompts/*.md", "llm/*.yaml"]
